<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sébastien Faurens — Agent immobilier Century 21 à Paris et en Île-de-France</title>
  <meta name="description" content="Sébastien Faurens, agent immobilier Century 21 à Paris 17ème et en Île-de-France : vente, achat et estimation gratuite de votre bien.">
  <link rel="icon" href="assets/img/logo-sf-noir.png">
  <link rel="preload" href="assets/fonts/montserrat-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Les textes et images de cette page se modifient dans le back-office (content/pages/accueil.json) -->
<body data-page="accueil" data-content="accueil" class="cms-loading">
  <header class="header" id="site-header"></header>

  <main>
    <section class="hero hero--center" data-bg="hero.image">
      <div class="container hero__content">
        <h1 class="hero__title"><span data-t="hero.titre"></span><br><span class="gold" data-t="hero.titre_or"></span></h1>
        <p class="hero__lead" data-t="hero.sous_titre"></p>
        <div class="hero__actions">
          <a href="biens.html" class="btn" data-t="hero.bouton_biens"></a>
          <a href="estimation.html" class="btn btn--outline" data-t="hero.bouton_estimation"></a>
        </div>
      </div>
    </section>

    <section class="stats" aria-label="Chiffres clés">
      <ul class="container" data-list="chiffres">
        <template><li><strong data-t="nombre"></strong><span data-t="libelle"></span></li></template>
      </ul>
    </section>

    <section class="section" id="pourquoi">
      <div class="container">
        <h2 class="title" data-t="pourquoi.titre"></h2>
        <div class="features" data-list="pourquoi.atouts">
          <template>
            <div class="feature">
              <div class="feature__icon"><img data-img="icone" alt=""></div>
              <h3 data-t="titre"></h3>
              <p data-t="texte"></p>
            </div>
          </template>
        </div>
        <div class="actions"><a href="contact.html" class="btn" data-t="pourquoi.bouton"></a></div>
      </div>
    </section>

    <section class="section section--light">
      <div class="container">
        <h2 class="title" data-t="selection.titre"></h2>
        <p class="subtitle" data-t="selection.sous_titre"></p>
        <div class="cards" id="selection"></div>
        <div class="actions"><a href="biens.html" class="btn" data-t="selection.bouton"></a></div>
      </div>
    </section>

    <section class="section section--dark">
      <div class="container">
        <h2 class="title" data-t="gestion.titre"></h2>
        <p class="subtitle" data-t="gestion.sous_titre"></p>
        <div class="benefits" data-list="gestion.avantages">
          <template>
            <div class="benefit">
              <div class="benefit__icon"><img data-img="icone" alt=""></div>
              <div>
                <h3 data-t="titre"></h3>
                <p data-t="texte"></p>
              </div>
            </div>
          </template>
        </div>
        <p class="punchline"><span data-t="gestion.phrase"></span><br><strong data-t="gestion.phrase_or"></strong></p>
        <div class="actions"><a href="estimation.html" class="btn" data-t="gestion.bouton"></a></div>
      </div>
    </section>

    <section class="section section--light">
      <div class="container">
        <h2 class="title" data-t="avis.titre"></h2>
        <p class="subtitle" data-t="avis.sous_titre"></p>
        <div class="stars" aria-label="5 étoiles sur 5">
          <img src="assets/icons/etoile.png" alt=""><img src="assets/icons/etoile.png" alt=""><img src="assets/icons/etoile.png" alt=""><img src="assets/icons/etoile.png" alt=""><img src="assets/icons/etoile.png" alt="">
        </div>
        <div class="reviews">
          <div class="reviews__list"></div>
          <div class="dots"></div>
        </div>
        <p class="cta-line"><span data-t="avis.phrase"></span> <strong data-t="avis.phrase_or"></strong></p>
        <div class="actions"><a href="contact.html" class="btn" data-t="avis.bouton"></a></div>
      </div>
    </section>
  </main>

  <footer class="footer" id="site-footer"></footer>
  <script src="js/cms.js" defer></script>
  <script src="js/layout.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
